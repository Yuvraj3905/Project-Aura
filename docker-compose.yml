# Aura — local stack. Unique host ports to avoid collisions with other projects.
# Port map (host -> container):
#   postgres     : 5440  -> 5432   (5432/5433/5435 already taken on this machine)
#   ollama       : 11435 -> 11434  (host 11434 already in use)
# Reserved for later services (added in their build phases):
#   web          : 3100
#   ml-service   : 8100
#   rasa         : 5105
#   rasa-actions : 5155

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "5440:5432"
    volumes:
      - aura_pgdata:/var/lib/postgresql/data
      # Init dir runs *.sql in alphabetical order: extension (00) before schema (01).
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./db/migrations/0001_init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/migrations/0002_ticket_in_progress.sql:/docker-entrypoint-initdb.d/02_ticket_in_progress.sql:ro
      - ./db/migrations/0003_llm_usage.sql:/docker-entrypoint-initdb.d/03_llm_usage.sql:ro
      - ./db/migrations/0004_leads_orders.sql:/docker-entrypoint-initdb.d/04_leads_orders.sql:ro
      - ./db/migrations/0005_hybrid_semantic.sql:/docker-entrypoint-initdb.d/05_hybrid_semantic.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: aura-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    environment:
      # Keep the model resident in RAM for 30m after the last request so we don't pay
      # the multi-second model-load cost on every call (ml-service also sends keep_alive
      # per request; this is the server-side default for any other caller).
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - aura_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: pull the model once ollama is serving, then exit.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: aura-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull llama3:8b"]
    restart: "no"

  # Cache: query embeddings + grounded answers. Loopback-bound.
  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ml-service:
    build: ./ml-service
    container_name: aura-ml-service
    restart: unless-stopped
    ports:
      # Host-bound to localhost only; worker/web reach it over the compose network.
      - "127.0.0.1:8100:8100"
    environment:
      REDIS_URL: redis://redis:6379/0
      # Interpolated from ./.env if present, else the defaults below (= config.py defaults).
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.45}
    volumes:
      # Shared upload volume: web/worker write here, ml-service reads by path.
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./web
    container_name: aura-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://aura:aura@postgres:5432/aura
      ML_SERVICE_URL: http://ml-service:8100
      RASA_URL: http://rasa:5005
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
      PORT: "3100"
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      # ChatGPT/OpenAI prices (USD per 1M tokens, "input,output") for the cost-comparison
      # panel. Interpolated from ./.env; defaults below are illustrative published prices.
      OPENAI_PRICE_GPT_4O: ${OPENAI_PRICE_GPT_4O:-2.50,10.00}
      OPENAI_PRICE_GPT_4O_MINI: ${OPENAI_PRICE_GPT_4O_MINI:-0.15,0.60}
      OPENAI_PRICE_GPT_35_TURBO: ${OPENAI_PRICE_GPT_35_TURBO:-0.50,1.50}
    ports:
      # Bound to localhost — the dashboard exposes PII (chat, ticket emails, doc
      # filenames + summaries). LAN access requires DASHBOARD_TOKEN + a tunnel.
      - "127.0.0.1:3100:3100"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # pg-boss consumer — same image as web, different entrypoint. No port, no file access
  # (it only relays job paths to ml-service).
  worker:
    build: ./web
    container_name: aura-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://aura:aura@postgres:5432/aura
      ML_SERVICE_URL: http://ml-service:8100
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  # Custom action server — loads ./rasa/actions; calls ml-service /answer.
  rasa-actions:
    image: rasa/rasa-sdk:3.6.2
    container_name: aura-rasa-actions
    restart: unless-stopped
    ports:
      - "5155:5055"
    volumes:
      - ./rasa/actions:/app/actions
    environment:
      ML_SERVICE_URL: http://ml-service:8100

  # Live container-log viewer (raw stdout/stderr per service).
  # Bound to localhost: the socket mount exposes all containers on this host.
  dozzle:
    image: amir20/dozzle:latest
    container_name: aura-dozzle
    restart: unless-stopped
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Dialogue manager. Train first:  docker compose run --rm rasa train
  rasa:
    image: rasa/rasa:3.6.20-full
    container_name: aura-rasa
    restart: unless-stopped
    ports:
      - "5105:5005"
    volumes:
      - ./rasa:/app
    command: ["run", "--enable-api", "--cors", "*"]
    depends_on:
      postgres:
        condition: service_healthy
      rasa-actions:
        condition: service_started

volumes:
  aura_pgdata:
  aura_ollama:
